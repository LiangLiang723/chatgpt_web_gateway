name: Phase 5 Apply Docker Smoke Cleanup

on:
  push:
    branches:
      - phase-5-streaming

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: node scripts/.phase5-patch-smoke.mjs
      - run: corepack pnpm exec prettier --write scripts/docker-smoke.mjs
      - name: Commit cleanup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/docker-smoke.mjs
          git commit -m "🐛 恢复 Docker smoke 临时目录宿主 ownership"
          git push
