name: Phase 5 Docker Smoke Diagnostic

on:
  push:
    branches:
      - phase-5-streaming

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm docker:build
      - name: Run Docker smoke and capture output
        id: smoke
        shell: bash
        run: |
          set +e
          corepack pnpm docker:smoke > docker-smoke.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 docker-smoke.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-docker-smoke-log
          path: docker-smoke.log
          if-no-files-found: error
      - name: Preserve Docker smoke exit code
        run: exit "${{ steps.smoke.outputs.status }}"
