name: Phase 5 Verify

on:
  push:
    branches:
      - phase-5-streaming

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Patch Docker smoke cleanup once
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "scripts/docker-smoke.mjs";
            const source = readFileSync(path, "utf8");
            const oldText = "try {\n  await main();\n} finally {\n  rmSync(dataPath, { recursive: true, force: true });\n}\n";
            const newText = [
              "function cleanupDataPath() {",
              "  const cleanup = spawnSync(",
              "    \"docker\",",
              "    [",
              "      \"run\",",
              "      \"--rm\",",
              "      \"--user\",",
              "      \"0:0\",",
              "      \"--entrypoint\",",
              "      \"sh\",",
              "      \"-v\",",
              "      dataPath + \":/cleanup\",",
              "      env.IMAGE_NAME,",
              "      \"-lc\",",
              "      \"find /cleanup -mindepth 1 -delete\",",
              "    ],",
              "    { cwd: process.cwd(), env, encoding: \"utf8\" },",
              "  );",
              "  if (cleanup.status !== 0) {",
              "    throw new Error(",
              "      \"Failed to clean Docker smoke bind mount: \" +",
              "        (cleanup.stderr || cleanup.stdout || \"unknown error\"),",
              "    );",
              "  }",
              "  rmSync(dataPath, { recursive: true, force: true });",
              "}",
              "",
              "try {",
              "  await main();",
              "} finally {",
              "  cleanupDataPath();",
              "}",
              "",
            ].join("\n");
            if (!source.includes(oldText)) throw new Error("Docker smoke cleanup block changed unexpectedly");
            writeFileSync(path, source.replace(oldText, newText));
          '
          corepack pnpm exec prettier --write scripts/docker-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/docker-smoke.mjs
          git commit -m "🐛 修复 Docker smoke 跨 UID 临时目录清理"
          git push
      - run: corepack pnpm verify
      - run: corepack pnpm docker:build
      - run: docker image inspect chatgpt-web-gateway:phase1 --format '{{.Id}}'
      - run: corepack pnpm docker:smoke
