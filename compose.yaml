services:
  gateway:
    image: ${IMAGE_NAME:-chatgpt-web-gateway:phase1}
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env}
      DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UI_MODE: headless
      MAX_ACTIVE_PAGES: ${MAX_ACTIVE_PAGES:-4}
      PAGE_IDLE_TIMEOUT_MINUTES: ${PAGE_IDLE_TIMEOUT_MINUTES:-30}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-128000}
      MODEL_MAX_INPUT_TOKENS: ${MODEL_MAX_INPUT_TOKENS:-128000}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-32768}
      CHATGPT_PROXY_SERVER: ${CHATGPT_PROXY_SERVER:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      MAINTENANCE_URL: ${MAINTENANCE_URL:-https://chatgpt.com/}
    ports:
      - '${GATEWAY_BIND:-0.0.0.0}:${PORT:-3000}:${PORT:-3000}'
    volumes:
      - '${DATA_PATH:-./data}:/data'
    shm_size: 1gb
